<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobalt BOMTOON Login</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; width: 280px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { min-height: 2.5em; }
    button { display: block; margin-top: 8px; width: 100%; }
  </style>

<body>

  <script src="protocol.js"></script>
  <script src="popup.js"></script>

</html>
